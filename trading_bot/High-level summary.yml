    Recommended next steps, in priority order
    
    1) Build the Unified Candidate Scorer
    This should be the next major milestone.
    
    Why first:
    - it is the biggest missing piece between “multi-bot system” and “smart portfolio brain”
    - it directly uses the research you already gathered
    - it improves capital allocation quality without needing live money yet
    
    What it should do:
    - collect candidate trades from all spot bots
    - score each candidate on a common scale
    - include:
      - expected upside
      - stop distance / risk
      - regime fit
      - recent bot performance
      - coin exposure concentration
      - market stress conditions
      - liquidity / volume filters
    - let manager decide:
      - approve / reject / downsize / prioritize
    
    Target outcome:
    - manager becomes selector, not just allocator
    
    2) Connect analysis results to live config decisions
    You already have optimizer logic offline.
    Next step:
    - feed optimizer output into bot configs or manager weights
    - avoid hardcoding static assumptions forever
    
    Examples:
    - bot weight adjustments from recent optimizer results
    - per-regime preferred parameter presets
    - confidence penalties for underperforming strategies
    
    3) Add proper validation workflow for strategy changes
    Before any strategy setting changes automatically:
    - backtest
    - walk-forward or rolling validation
    - compare against baseline
    - require minimum thresholds:
      - win rate
      - PnL
      - drawdown
      - Sharpe-like score
    
    This prevents “research churn” from destabilizing the bot.
    
